copy_upstream_release_description: false
upstream_package_name: yaru
upstream_project_url: https://github.com/ubuntu/yaru

jobs:
  - job: pull_from_upstream
    trigger: release
    dist_git_branches:
      - fedora-development

  - job: koji_build
    trigger: commit
    allowed_pr_authors: ["atim"]
    allowed_committers: ["atim"]
    dist_git_branches:
      - fedora-all

  - job: bodhi_update
    trigger: commit
    dist_git_branches:
      - fedora-branched
